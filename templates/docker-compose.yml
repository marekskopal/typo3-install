services:
    proxy:
        build:
            context: ./proxy
            dockerfile: Dockerfile
        environment:
            PROXY_HOST: ${PROXY_HOST}
            PROXY_PORT_SSL: ${PROXY_PORT_SSL}
        ports:
            - "${PROXY_PORT}:80"
            - "${PROXY_PORT_SSL}:443"
        restart: unless-stopped
        depends_on:
            - web
        networks:
            - frontend
        volumes:
            - ${PROXY_SSL_CERT}:/etc/nginx/ssl/server.pem:ro
            - ${PROXY_SSL_KEY}:/etc/nginx/ssl/server.key:ro

    web:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            MYSQL_HOST: ${MYSQL_HOST}
            MYSQL_PORT: ${MYSQL_PORT:-3306}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            TYPO3_CONTEXT: ${TYPO3_CONTEXT}
            TYPO3_BASE_URL: ${TYPO3_BASE_URL}
            TYPO3_ENCRYPTION_KEY: ${TYPO3_ENCRYPTION_KEY}
            TYPO3_INSTALL_TOOL_PASSWORD: ${TYPO3_INSTALL_TOOL_PASSWORD:-}
            TYPO3_SMTP_USERNAME: ${TYPO3_SMTP_USERNAME}
            TYPO3_SMTP_PASSWORD: ${TYPO3_SMTP_PASSWORD}
            TYPO3_SMTP_SERVER: ${TYPO3_SMTP_SERVER}
            REVERSE_PROXY_IP: ${REVERSE_PROXY_IP}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped
        networks:
            - frontend
        # Only the uploads and var/ persist; public/ and config/ come from the image, so a rebuild updates them.
        volumes:
            - {{volumePrefix}}_web_fileadmin:/var/www/html/public/fileadmin
            - {{volumePrefix}}_web_var:/var/www/html/var
            - ./log:/var/www/html/var/log

networks:
    frontend:
        name: {{volumePrefix}}_frontend

volumes:
    {{volumePrefix}}_web_fileadmin:
        name: {{volumePrefix}}_web_fileadmin
    {{volumePrefix}}_web_var:
        name: {{volumePrefix}}_web_var
